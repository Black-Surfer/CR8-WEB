<div
  class="flex flex-wrap h-full my-20 mx-10 px-10 justify-center items-center"
>
  <div class="flex flex-wrap gap-6 justify-center">
    <div
      *ngFor="let item of listResult"
      class="bg-white rounded-lg shadow-lg p-4 flex flex-col w-full sm:w-1/2 md:w-1/3 lg:w-1/4"
    >
      <img
        [src]="item.imageURL"
        alt="{{ item.name }}"
        class="w-full h-48 object-cover rounded-t-lg"
      />
      <div class="flex flex-col flex-grow p-4">
        <h2 class="text-xl font-bold mb-2 h-15 overflow-hidden">
          {{ item.name }}
        </h2>
        <p class="text-gray-700 mb-2 h-16 overflow-hidden">
          {{ item.description }}
        </p>
        <p class="text-gray-900 font-semibold mb-2">Size: {{ item.size }}</p>
        <p class="text-gray-900 font-semibold mb-2">Color: {{ item.color }}</p>
        <p class="text-gray-900 font-bold mb-2">${{ item.price }}</p>
        <div class="mt-auto">
          <button
            class="bg-[#2c0e39] text-white px-4 py-2 rounded hover:bg-blue-600 w-full"
          >
            Add to Cart
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
