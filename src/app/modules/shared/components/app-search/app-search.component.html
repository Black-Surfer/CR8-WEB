<div class="my-[20px] mt-[40px] mx-auto text-center">
  <input
    #searchinput
    placeholder="Search"
    class="w-[40%] h-[5.5vh] py-[1px] px-[10px] rounded-[5px] bg-[#efefef] border-solid border-2 border-[#2c0e39]"
  />
  <button
    (click)="onSearch(searchinput.value)"
    class="py-[12px] px-[30px] bg-[#2c0e39] ml-[-5px] text-[#fff]"
  >
    Search
  </button>
</div>
